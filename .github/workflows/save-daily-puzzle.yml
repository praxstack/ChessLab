name: Save daily puzzle

# Keeps a list of daily puzzle positions for the puzzle page
# (askthemove.online/puzzleanalyzr). Each run saves Chess.com's puzzle of the
# day, up to 30 random older ones (Chess.com shares old puzzles only at random,
# so this is how past dates fill in), and Lichess's puzzle of the day (Lichess
# has no history, so its days fill in from the first run onwards).
# The date, the position (FEN) and Chess.com's name are kept: never the answer.
# The name can hint at the answer, so the page keeps it covered until tapped.
# The list lives on its own branch, puzzle-archive, so main gets no daily commits.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: save-daily-puzzle
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Switch to the archive branch
        run: |
          if git fetch --depth 1 origin puzzle-archive; then
            git switch -c puzzle-archive FETCH_HEAD
          else
            git switch --orphan puzzle-archive
          fi

      - name: Add today's puzzles and random older ones
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request

          UA = 'AskTheMove puzzle launcher (github.com/praxstack/ChessLab)'
          path = 'puzzles.json'
          try:
              with open(path) as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {}
          puzzles = data.get('puzzles', {})
          names = data.get('names', {})
          lichess = data.get('lichess', {})
          RANDOM_PULLS = 30

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          added = 0
          urls = ['https://api.chess.com/pub/puzzle'] + ['https://api.chess.com/pub/puzzle/random'] * RANDOM_PULLS
          for url in urls:
              try:
                  j = get(url)
              except Exception as e:
                  print('skip', url, e)
                  continue
              m = re.search(r'/daily/(\d{4}-\d{2}-\d{2})', j.get('url', ''))
              fen = j.get('fen', '')
              if m and re.match(r'^[pnbrqkPNBRQK1-8/]+ [wb] ', fen):
                  date = m.group(1)
                  title = (j.get('title') or '').strip()[:120]
                  if date not in puzzles:
                      puzzles[date] = fen
                      added += 1
                  if title and date not in names:
                      names[date] = title
              # The random puzzle is cached for a few seconds, so ask slowly: fewer repeats, and gentle on the API.
              time.sleep(12)

          # Lichess: only today's puzzle is offered. File it under today's date (UTC), once per puzzle.
          try:
              req = urllib.request.Request('https://lichess.org/api/puzzle/daily', headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  p = json.load(r).get('puzzle', {})
              pid, fen = p.get('id', ''), p.get('fen', '')
              today = time.strftime('%Y-%m-%d', time.gmtime())
              seen = {v.get('id') for v in lichess.values()}
              if re.match(r'^[A-Za-z0-9]{5}$', pid) and re.match(r'^[pnbrqkPNBRQK1-8/]+ [wb] ', fen) and pid not in seen and today not in lichess:
                  lichess[today] = {'id': pid, 'fen': fen}
                  added += 1
          except Exception as e:
              print('skip lichess', e)

          data = {'note': 'Daily puzzle positions and names by date (Chess.com), and Lichess daily puzzles by the date saved. No answers.',
                  'puzzles': dict(sorted(puzzles.items())),
                  'names': dict(sorted(names.items())),
                  'lichess': dict(sorted(lichess.items()))}
          with open(path, 'w') as f:
              json.dump(data, f, indent=0, separators=(',', ':'))
              f.write('\n')
          print(f'added {added}, Chess.com total {len(puzzles)}, Lichess total {len(lichess)}')
          PY

      - name: Commit if anything changed
        run: |
          git add puzzles.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Save daily puzzle positions"
          git push origin puzzle-archive
